name: Docker Image CI (Optimized)

on:
  push:
    branches: [ "duoduo" ]
  pull_request:
    branches: [ "duoduo" ]

env:
  REGISTRY: docker.io
  DOCKER_IMAGE_NAME: oilycn/wanfeng-tv

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 优化1: 设置 Docker Buildx 缓存
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      # 优化2: 登录 Docker Hub (提前登录避免推送时的延迟)
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/duoduo'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 优化3: 提取元数据
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/duoduo' }}

      # 优化4: 构建单平台镜像 (大幅减少构建时间)
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          # 移除多平台构建，只构建 amd64 (减少 50% 构建时间)
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/duoduo' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 优化5: 使用更激进的缓存策略
          cache-from: |
            type=gha,scope=${{ github.workflow }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:cache
          cache-to: |
            type=gha,scope=${{ github.workflow }},mode=max
            type=registry,ref=${{ env.REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:cache,mode=max